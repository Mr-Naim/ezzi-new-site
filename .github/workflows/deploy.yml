name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed — the server already has its own clone (set up
      # via cPanel's Git Version Control, cloned from this repo). All this
      # job does is SSH in and fast-forward that clone to the latest commit.
      - name: Pull latest on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "--- whoami / pwd ---"
            whoami
            pwd
            echo "--- home directory listing ---"
            ls -la ~
            echo "--- public_html listing ---"
            ls -la ~/public_html
            echo "--- git status ---"
            git -C ~/public_html status 2>&1 || echo "NOT A GIT REPO"
            echo "--- git remote -v ---"
            git -C ~/public_html remote -v 2>&1
            echo "--- git branch -a ---"
            git -C ~/public_html branch -a 2>&1
            echo "--- git log -3 (before pull) ---"
            git -C ~/public_html log -3 --oneline 2>&1
            echo "--- git pull attempt ---"
            git -C ~/public_html pull origin main 2>&1
            echo "--- git log -3 (after pull) ---"
            git -C ~/public_html log -3 --oneline 2>&1
