name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed — the server already has its own clone (set up
      # via cPanel's Git Version Control, cloned from this repo). All this
      # job does is SSH in and fast-forward that clone to the latest commit.
      - name: Pull latest on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            git -C ~/public_html pull origin main
