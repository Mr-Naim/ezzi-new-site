		// Phone/tablet header: transparent at the top of the page (over the
		// video on the homepage), solid once the visitor scrolls into content.
		(function () {
			var bar = document.querySelector('.ezzi-mobile-topbar');
			if (!bar) return;
			var hero = document.querySelector('.ezzi-video-hero');
			var ticking = false;
			function update() {
				ticking = false;
				var solid = hero ? hero.getBoundingClientRect().bottom <= bar.offsetHeight : window.scrollY > 8;
				bar.classList.toggle('is-solid', solid);
			}
			function onScroll() {
				if (!ticking) { ticking = true; requestAnimationFrame(update); }
			}
			window.addEventListener('scroll', onScroll, { passive: true });
			window.addEventListener('resize', onScroll);
			update();
		})();
	</script><script>
